[package]
name = "aitunes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aitunes"
path = "src/main.rs"

[[bin]]
name = "debug_api"
path = "debug_api.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.27"
ratatui = "0.24"
dirs = "5.0"
base64 = "0.21"
rodio = { version = "0.17", features = ["mp3", "flac", "vorbis", "wav"] }
url = "2.4"
anyhow = "1.0"
